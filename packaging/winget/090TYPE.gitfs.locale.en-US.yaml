ShortDescription: Mounts a git repository as a drive
Description: |-
  Mounts a git repository as a drive. Commits are folders, and a file is a
  folder too, holding every version of itself. See what a file was three
  months ago without a checkout, without touching your working copy, and
  without leaving Explorer, an IDE, grep or Word.

  Writes are allowed and never reach the repository: they land in a
  copy-on-write sandbox. Needs the WinFsp driver and the .NET 8 runtime;
  run "gitfs doctor" and it names anything missing.
Moniker: gitfs
